name: Compilar instalador Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Compilar frontend (Vite)
        run: npm run build

      - name: Generar instalador .exe
        run: npm run dist

      - name: Subir instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: FacturacionMovistar-instalador
          path: release/*.exe
