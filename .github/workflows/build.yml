name: Compilar instalador Windows

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Compilar frontend (Vite)
        run: npm run build

      - name: Crear archivo de credenciales privadas (correo de activacion)
        shell: bash
        env:
          CORREO_ACTIVACION_PASSWORD: ${{ secrets.CORREO_ACTIVACION_PASSWORD }}
        run: |
          cat > electron/config-correo-privado.js << EOF
          // Generado automaticamente por el workflow de GitHub Actions (build.yml) a partir del
          // secreto CORREO_ACTIVACION_PASSWORD -- NUNCA se sube al repositorio, solo existe
          // durante la compilacion en el servidor de GitHub y dentro del instalador ya compilado.
          module.exports = {
            remitente: 'movisync1@gmail.com',
            password: '${CORREO_ACTIVACION_PASSWORD}',
            destino: 'jctecnologia.sys@gmail.com'
          };
          EOF

      - name: Generar instalador .exe
        run: npm run dist -- --publish=never

      - name: Subir instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: FacturacionMovistar-instalador
          path: release/*.exe
          retention-days: 1
